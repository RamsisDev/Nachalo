[package]
name = "nachalo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "PAKE-authenticated first contact: 6 words, 3 safety words, CPace + X25519 + ML-KEM-768."
repository = "https://github.com/RamsisDev/Nachalo"
keywords = ["pake", "cpace", "ml-kem", "post-quantum", "handshake"]
categories = ["cryptography"]
include = ["src/**", "LICENSE-*", "README.md"]

[dependencies]
chacha20poly1305 = "0.11.0"
curve25519-dalek = "5.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
ml-kem = { version = "0.3.3", features = ["zeroize"] }
sha2 = "0.11.1"
subtle = "2.6.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
