[package]
name = "nachalo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Reference implementation of Nachalo, a protocol for PAKE-authenticated first contact from a few words: live, by appointment or with a physical token. CPace + X25519 + ML-KEM-768."
repository = "https://github.com/RamsisDev/Nachalo"
keywords = ["pake", "cpace", "ml-kem", "post-quantum", "handshake"]
categories = ["cryptography"]
include = ["src/**", "vectors/**", "docs/**", "LICENSE-*", "README.md"]

[dependencies]
chacha20poly1305 = "0.11.0"
curve25519-dalek = "5.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768"] }
sha2 = "0.11.1"
subtle = "2.6.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"

[dev-dependencies]
criterion = "0.8.2"
hex = "0.4.3"
proptest = "1.12.0"
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bench]]
name = "handshake"
harness = false
